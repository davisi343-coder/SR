<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Link Index</title>
</head>
<body>

    <h1>Welcome to My Links Page</h1>
    <p>Below are examples of standard web links:</p>

    <ul>
        <!-- External link that opens in a new tab -->
        <li>
            <a href="https://wikipedia.org" target="_blank">Visit Wikipedia</a>
        </li>
        
        <!-- Relative link to another local file in the same directory -->
        <li>
            <a href="about.html">About This Site</a>
        </li>
        
        <!-- Email link that opens the user's email client -->
        <li>
            <a href="mailto:example@email.com">Contact Me via Email</a>
        </li>
    </ul>

</body>
</html>
